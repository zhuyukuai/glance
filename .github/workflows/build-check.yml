name: Xcode Build Check

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'codex/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (macOS 15, unsigned)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit runtime sources for network access
        shell: bash
        run: |
          set -euo pipefail

          forbidden_runtime='URLSession|URLRequest|NSURLConnection|import[[:space:]]+Network|NWConnection|NWListener|NWBrowser|NWPathMonitor|CFNetwork|CFSocket|CFStreamCreatePairWithSocketToHost|Darwin\.(socket|connect)|getaddrinfo|import[[:space:]]+WebKit|WKWebView|import[[:space:]]+Sparkle|Alamofire|Starscream|Sentry|PostHog|Mixpanel|Firebase|Amplitude|Datadog|/usr/bin/curl|/usr/bin/wget'

          if find glance -type f -name '*.swift' -print0 | xargs -0 grep -nE "$forbidden_runtime"; then
            echo 'Forbidden runtime networking primitive or telemetry/update dependency found in Swift sources.'
            exit 1
          fi

          if find glance -type f -name '*.swift' -print0 | xargs -0 grep -nE '"https?://'; then
            echo 'External HTTP(S) URL string found in Swift runtime sources.'
            exit 1
          fi

          if grep -nE 'com\.apple\.security\.network\.(client|server)' glance/*.entitlements; then
            echo 'Network client/server entitlement found.'
            exit 1
          fi

          if grep -nE '<key>SU(FeedURL|PublicEDKey|AutomaticallyUpdate|EnableInstallerLauncherService)</key>' glance/*.plist; then
            echo 'Sparkle network/update plist configuration found.'
            exit 1
          fi

          if grep -nE 'Sparkle|XCRemoteSwiftPackageReference' glance.xcodeproj/project.pbxproj; then
            echo 'Unexpected remote package dependency in the offline build.'
            exit 1
          fi

          if grep -nE '\.post\(tap:|CGEventPost\(' glance/KeystrokeInjector.swift; then
            echo 'Global keyboard posting must not be used for password delivery.'
            exit 1
          fi

          echo 'Offline source audit passed (not an OS-enforced network sandbox).'


      - name: Run security regression tests
        run: bash tools/run_security_tests.sh

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build without code signing
        run: |
          set -o pipefail
          xcodebuild \
            -project glance.xcodeproj \
            -scheme glance \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package local test build
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug/glance.app"
          mkdir -p test-package
          # Ad-hoc signing supports local testing, not distribution trust or notarization.
          # No provisioned keychain sharing group is available on the CI runner.
          cat > "$RUNNER_TEMP/test.entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>com.apple.security.device.camera</key><true/></dict></plist>
          PLIST
          codesign --force --sign - --options runtime --entitlements "$RUNNER_TEMP/test.entitlements" "$app"
          codesign --verify --deep --strict "$app"
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/glance"
          ditto -c -k --sequesterRsrc --keepParent "$app" test-package/glance-test-universal.zip
          git rev-parse HEAD > test-package/SOURCE_COMMIT.txt
          (cd test-package && shasum -a 256 glance-test-universal.zip > SHA256SUMS)
          cat > test-package/READ-ME.txt <<'NOTE'
          Local test build only. Ad-hoc signed; not Developer ID signed or notarized.
          Includes Apple Silicon and Intel binaries. Requires macOS 15 or later.
          The test signature has camera access but no provisioned keychain sharing group.
          Use a disposable macOS account for password and lock-screen testing.
          Grant permissions yourself through macOS. Never disable Gatekeeper or SIP.
          Hardware acceptance testing is still required; see docs/security-testing.md.
          NOTE

      - name: Upload local test package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: glance-test-universal
          path: test-package/
          if-no-files-found: error
          retention-days: 7
